<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bowser — Offline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #09090b;
    color: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .logo {
    width: 64px; height: 64px; margin-bottom: 24px;
    background: #6366f1; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 36px; height: 36px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.02em; }
  p { font-size: 14px; color: #a1a1aa; margin-bottom: 24px; }
  button {
    background: #6366f1; color: #fff; border: none;
    padding: 12px 24px; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:active { opacity: 0.8; }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="18" height="18" rx="4" stroke="white" stroke-width="2"/>
      <text x="12" y="17" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="700">B</text>
    </svg>
  </div>
  <h1>You are offline</h1>
  <p>Check your connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
