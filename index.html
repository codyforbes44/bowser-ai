    <style id="bowser-splash-style">
      #bowser-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        transition: opacity 0.3s ease;
      }
      #bowser-splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #bowser-splash img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        animation: splash-pulse 1.5s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
